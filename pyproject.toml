[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fusion-video-pipeline"
version = "0.1.0"
description = "One canonical transcript to v7 tree notes and a visual HTML report"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp>=3.12",
  "bilibili-api-python>=17.3",
  "python-dotenv>=1.1",
  "requests>=2.32",
  "video-report-agent",
]

[project.scripts]
fusion-video = "fusion_video_pipeline.cli:main"
fusion-benchmark = "fusion_video_pipeline.benchmark_cli:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.14"]

[tool.uv.sources]
video-report-agent = { path = "../video-report-agent", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["runs", "cache"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
